
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجرنا الحرفي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f6f2eb;
            margin: 0;
            padding: 0;
            color: #4a3525;
        }
        header {
            background-color: #543828;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }
        header h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }
        header p {
            margin: 0;
            font-size: 16px;
            color: #e8dfd5;
        }
        nav {
            background-color: #e6ddd0;
            text-align: center;
            padding: 15px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #d8cdc0;
        }
        nav span {
            margin: 0 15px;
            cursor: pointer;
        }
        .section-header {
            text-align: center;
            padding: 35px 20px 20px;
        }
        .section-header h2 {
            font-size: 26px;
            margin: 0 0 10px;
        }
        .section-header p {
            color: #7a6352;
            margin: 0;
            font-size: 15px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }
        .product-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(84, 56, 40, 0.08);
            padding: 20px;
            text-align: center;
            border: 1px solid #ede6dc;
        }
        .image-box {
            background-color: #efe7dc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 180px;
        }
        .image-box img {
            max-width: 100%;
            max-height: 160px;
            object-fit: contain;
        }
        .product-title {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 8px;
            color: #4a3525;
        }
        .product-desc {
            font-size: 14px;
            color: #7a6352;
            margin: 0 0 12px;
        }
        .product-price {
            font-size: 17px;
            font-weight: bold;
            color: #543828;
            margin-bottom: 18px;
        }
        .add-btn {
            background-color: #543828;
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 80%;
        }
        .add-btn:hover {
            background-color: #3e281c;
        }
    </style>
</head>
<body>

    <header>
        <h1>كل قطعة تحكي حكاية</h1>
        <p>منتجات حرفية صنعت بحب وإبداع</p>
    </header>
