
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الأسعار - متجري</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #4a4a4a;
            margin-bottom: 30px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .product-card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 15px;
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0 10px;
        }
        .product-price {
            color: #27ae60;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>قائمة أسعار المنتجات</h1>

    <div class="products-grid">
        <!-- المنتج الأول -->
        <div class="product-card">
            <img src="https://via.placeholder.com/250" alt="صورة المنتج">
            <div class="product-title">اسم المنتج الأول</div>
            <div class="product-price">150 ريال</div>
        </div>

        <!-- المنتج الثاني -->
        <div class="product-card">
            <img src="https://via.placeholder.com/250" alt="صورة المنتج">
            <div class="product-title">اسم المنتج الثاني</div>
            <div class="product-price">230 ريال</div>
        </div>
    </div>

</body>
</html>
