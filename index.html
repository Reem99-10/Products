<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الحرفي</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f7f4f0;
            color: #4a3b32;
            margin: 0;
            padding: 0;
            text-align: right;
        }
        header {
            background-color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e6dfd5;
        }
        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #4a3b32;
            font-weight: bold;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            color: #5c4033;
        }
        .subtitle {
            text-align: center;
            color: #8c7365;
            margin-bottom: 40px;
        }
        .product-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            text-align: center;
        }
        .product-card img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 8px;
        }
        .product-card h3 {
            margin-top: 15px;
            color: #4a3b32;
        }
        .price {
            font-size: 1.2em;
            font-weight: bold;
            color: #5c4033;
            margin: 10px 0;
        }
        .btn {
            background-color: #5c4033;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }
        .btn:hover {
            background-color: #4a3b32;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#">الرئيسية</a>
        </nav>
        <div>سلة التسوق 🛒</div>
    </header>

    <div class="container">
        <h1>منتجاتنا الحرفية</h1>
        <p class="subtitle">اختاري قطعتك المفضلة وأضيفيها إلى سلة التسوق.</p>

        <!-- المنتج الأول: حقيبة الكروشيه -->
        <div class="product-card">
            <img src="crochet-bag.jpg" alt="حقيبة كروشيه">
            <h3>حقيبة كروشيه وحامل كاميرا</h3>
            <p>مصنوعة بعناية فائقة وتفاصيل أنيقة.</p>
            <div class="price">250 ريال</div>
            <button class="btn">أضيفي إلى السلة</button>
        </div>

        <!-- المنتج الثاني: قطعة التطريز -->
        <div class="product-card">
            <img src="embroidery.jpg" alt="قطعة تطريز بالييرينا">
            <h3>قطعة تطريز بالييرينا</h3>
            <p>تصميم فني فريد وناعم.</p>
            <div class="price">215 ريال</div>
            <button class="btn">أضيفي إلى السلة</button>
        </div>

        <!-- المنتج الثالث: أكواب الفخار -->
        <div class="product-card">
            <img src="pottery-cup.jpg" alt="أكواب فخار">
            <h3>أكواب فخار مصنوعة يدويّاً</h3>
            <p>إبداع أصيل يزين جلستك بلمسة دافئة.</p>
            <div class="price">150 ريال</div>
            <button class="btn">أضيفي إلى السلة</button>
        </div>

    </div>

</body>
</html>
